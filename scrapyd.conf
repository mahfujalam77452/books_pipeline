[scrapyd]
eggs_dir          = /var/lib/scrapyd/eggs
logs_dir          = /var/lib/scrapyd/logs
dbs_dir           = /var/lib/scrapyd/dbs
jobs_to_keep      = 5
finished_to_keep  = 100
max_proc          = 0
max_proc_per_cpu  = 4
poll_interval     = 2.0
# 0.0.0.0 is required in Docker so the API is reachable from outside the container
bind_address      = 0.0.0.0
http_port         = 6800
debug             = off